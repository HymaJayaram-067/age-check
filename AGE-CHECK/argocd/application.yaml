apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: age-check-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/age-check.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: age-check
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
